                    const exists = prev.find(i => i.id === product.id);
                    if (exists) {
                        return prev.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                setIsCartOpen(true);
            };

                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;

                                        className="w-full pl-12 pr-4 py-3.5 rounded-full bg-darkroast border border-white/15 text-warmcream placeholder-warmcream/40 focus:outline-none focus:border-caramel transition-all text-sm"
                                    />
                                    <i data-lucide="search" className="w-5 h-5 text-warmcream/40 absolute left-4 top-1/2 -translate-y-1/2"></i>
                                </div>

                                {/* Category Pills */}
                                <div className="flex items-center gap-2 overflow-x-auto pb-4 no-scrollbar justify-start sm:justify-center">
                                    {MENU_CATEGORIES.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-5 py-2.5 rounded-full text-xs sm:text-sm font-medium whitespace-nowrap transition-all border ${
                                                selectedCategory === cat 
                                                ? 'bg-caramel text-espresso border-caramel font-bold' 
                                                : 'bg-darkroast text-warmcream/80 border-white/10 hover:border-caramel/40'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* PRODUCT GRID */}
                            {filteredProducts.length === 0 ? (
                                <div className="text-center py-16 text-warmcream/50 space-y-2">
                                    <i data-lucide="coffee" className="w-12 h-12 mx-auto text-caramel/40"></i>
                                    <p>No products found matching your search criteria.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 sm:gap-8">
                                    {filteredProducts.map(product => (
                                        <div 
                                            key={product.id}
                                            className="group bg-darkroast rounded-2xl overflow-hidden border border-white/10 hover:border-caramel/50 transition-all duration-300 flex flex-col justify-between"
                                        >
                                            <div>
                                                {/* Image */}
                                                <div className="relative aspect-[4/3] overflow-hidden bg-espresso">
                                                    <img 
                                                        src={product.image} 
                                                        alt={product.name} 
                                                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                                                    />
                                                    {product.isSignature && (
                                                        <span className="absolute top-3 left-3 bg-caramel text-espresso text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                                            ⭐ Signature
                                                        </span>
                                                    )}
                                                    {product.isPopular && !product.isSignature && (
                                                        <span className="absolute top-3 left-3 bg-espresso/80 text-caramel border border-caramel/30 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                                            Popular
                                                        </span>
                                                    )}
                                                </div>

                                                {/* Details */}
                                                <div className="p-5 space-y-2">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <h3 className="font-serif font-bold text-lg text-warmcream group-hover:text-caramel transition-colors">
                                                            {product.name}
                                                        </h3>
                                                    </div>
                                                    <p className="text-xs text-warmcream/60 line-clamp-2 leading-relaxed">
                                                        {product.description}
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Price & Action */}
                                            <div className="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5 mt-auto">
                                                <div>
                                                    <span className="text-xs text-warmcream/40 block">Price</span>
                                                    <span className="font-bold text-caramel text-base">
                                                        PKR {product.price}
                                                    </span>
                                                </div>
                                                <button
                                                    onClick={() => addToCart(product)}
                                                    className="px-4 py-2 rounded-full bg-caramel/10 border border-caramel/40 text-caramel hover:bg-caramel hover:text-espresso font-semibold text-xs transition-all flex items-center gap-1.5"
                                                >
                                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                                    Add
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>
                    </section>

                    {/* SIGNATURE DRINKS SHOWCASE */}
                    <section id="signature" className="py-24 bg-darkroast border-t border-white/5">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                            <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                                <div>
                                    <span className="text-caramel uppercase text-xs font-bold tracking-widest">Handcrafted Perfection</span>
                                    <h2 className="text-3xl sm:text-4xl font-serif font-bold text-warmcream mt-1">Signature Creations</h2>
                                </div>
                                <p className="text-warmcream/70 text-sm max-w-md">
                                    Discover our top recommended drinks formulated with proprietary syrups, imported matcha, and double-origin espresso.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {MENU_PRODUCTS.filter(p => p.isSignature).slice(0, 3).map(sig => (
                                    <div key={sig.id} className="relative rounded-2xl overflow-hidden border border-white/10 group">
                                        <div className="aspect-[3/4] relative">
                                            <img src={sig.image} alt={sig.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-espresso via-espresso/40 to-transparent"></div>
                                            <div className="absolute bottom-0 left-0 right-0 p-6 space-y-3">
                                                <span className="text-caramel font-serif text-sm italic">House Specialty</span>
                                                <h3 className="text-2xl font-serif font-bold text-warmcream">{sig.name}</h3>
                                                <p className="text-xs text-warmcream/70">{sig.description}</p>
                                                <div className="flex items-center justify-between pt-2">
                                                    <span className="text-caramel font-bold text-lg">PKR {sig.price}</span>
                                                    <button 
                                                        onClick={() => addToCart(sig)}
                                                        className="px-4 py-2 rounded-full bg-caramel text-espresso font-bold text-xs hover:bg-caramel/90 transition-all"
                                                    >
                                                        Order Item
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* PHOTO GALLERY LIGHTBOX */}
                    <section id="gallery" className="py-24 bg-espresso">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                            <div className="text-center space-y-2">
                                <span className="text-caramel uppercase text-xs font-bold tracking-widest">Visual Experience</span>
                                <h2 className="text-3xl sm:text-4xl font-serif font-bold text-warmcream">Café Gallery</h2>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                                {GALLERY_IMAGES.map((img, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => setLightboxImg(img.url)}
                                        className="aspect-square rounded-xl overflow-hidden cursor-pointer border border-white/10 group relative"
                                    >
                                        <img src={img.url} alt={img.caption} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                        <div className="absolute inset-0 bg-espresso/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-4 text-center">
                                            <span className="text-warmcream text-xs sm:text-sm font-medium">{img.caption}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* VISIT US / LOCATION SECTION */}
                    <section id="visit" className="py-24 bg-darkroast border-t border-white/5">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                
                                <div className="space-y-8">
                                    <div>
                                        <span className="text-caramel uppercase text-xs font-bold tracking-widest">Find Us In Lahore</span>
                                        <h2 className="text-3xl sm:text-4xl font-serif font-bold text-warmcream mt-1">Visit The Fuel Espresso</h2>
                                    </div>

                                    <div className="space-y-6 text-sm text-warmcream/80">
                                        <div className="flex items-start gap-4">
                                            <div className="p-3 rounded-full bg-caramel/10 border border-caramel/30 text-caramel shrink-0">
                                                <i data-lucide="map-pin" className="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-warmcream">Address</h4>
                                                <p className="text-warmcream/70 mt-1">{CONFIG.address}</p>
                                            </div>
                                        </div>

                                        <div className="flex items-start gap-4">
                                            <div className="p-3 rounded-full bg-caramel/10 border border-caramel/30 text-caramel shrink-0">
                                                <i data-lucide="phone" className="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-warmcream">Phone Number</h4>
                                                <a href={`tel:${CONFIG.formattedPhone}`} className="text-caramel hover:underline mt-1 inline-block">
                                                    {CONFIG.phone}
                                                </a>
                                            </div>
                                        </div>

                                        <div className="flex items-start gap-4">
                                            <div className="p-3 rounded-full bg-caramel/10 border border-caramel/30 text-caramel shrink-0">
                                                <i data-lucide="clock" className="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-warmcream">Opening Hours</h4>
                                                <p className="text-warmcream/70 mt-1">{CONFIG.openingHours}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-4 pt-4">
                                        <a 
                                            href={CONFIG.mapsLink} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="px-6 py-3 rounded-full bg-caramel text-espresso font-bold text-sm hover:bg-caramel/90 transition-all flex items-center gap-2"
                                        >
                                            <i data-lucide="navigation" className="w-4 h-4"></i>
                                            Open in Google Maps
                                        </a>
                                        <a 
                                            href={CONFIG.foodpandaLink} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="px-6 py-3 rounded-full bg-darkroast border border-white/20 text-warmcream hover:border-caramel text-sm font-medium transition-all"
                                        >
                                            View Foodpanda Listing
                                        </a>
                                    </div>
                                </div>

                                {/* MAP PLACEHOLDER / CTA CARD */}
                                <div className="bg-espresso rounded-2xl border border-white/10 p-8 space-y-6 text-center">
                                    <div className="w-16 h-16 rounded-full bg-caramel/10 border border-caramel/30 text-caramel flex items-center justify-center mx-auto">
                                        <i data-lucide="coffee" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-2xl font-serif font-bold text-warmcream">DHA Phase 6 Location</h3>
                                    <p className="text-sm text-warmcream/70 leading-relaxed">
                                        Conveniently situated inside Sector C, DHA Phase 6. Drop in for your morning espresso fix, late-night iced latte, or takeaway order.
                                    </p>
                                    <a 
                                        href={CONFIG.mapsLink} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-block w-full py-3.5 rounded-full bg-darkroast hover:bg-caramel hover:text-espresso text-caramel border border-caramel/40 font-bold text-sm transition-all"
                                    >
                                        Get Directions
                                    </a>
                                </div>

                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="bg-espresso border-t border-white/10 py-12 text-warmcream/60 text-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-caramel/20 text-caramel font-serif font-bold flex items-center justify-center">F</div>
                                    <span className="font-serif text-lg font-bold text-warmcream">THE FUEL ESPRESSO</span>
                                </div>

                                <div className="flex flex-wrap justify-center gap-6 text-warmcream/80">
                                    <a href="#home" className="hover:text-caramel">Home</a>
                                    <a href="#story" className="hover:text-caramel">Story</a>
                                    <a href="#menu" className="hover:text-caramel">Menu</a>
                                    <a href="#gallery" className="hover:text-caramel">Gallery</a>
                                    <a href="#visit" className="hover:text-caramel">Visit Us</a>
                                </div>
                            </div>

                            <div className="border-t border-white/5 pt-6 text-center space-y-2">
                                <p>© {new Date().getFullYear()} The Fuel Espresso. All Rights Reserved.</p>
                                <p className="text-[11px] text-warmcream/40">
                                    Demo concept created for client evaluation. All trademarks, names, and references belong to their respective owners.
                                </p>
                            </div>
                        </div>
                    </footer>

                    {/* CART DRAWER SLIDE-OVER */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 overflow-hidden bg-black/70 backdrop-blur-sm flex justify-end">
                            <div className="w-full max-w-md bg-darkroast h-full border-l border-white/10 flex flex-col justify-between p-6 overflow-y-auto">
                                <div>
                                    <div className="flex items-center justify-between pb-6 border-b border-white/10">
                                        <h3 className="text-xl font-serif font-bold text-warmcream flex items-center gap-2">
                                            <i data-lucide="shopping-bag" className="w-5 h-5 text-caramel"></i>
                                            Your Cart ({cartTotalCount})
                                        </h3>
                                        <button onClick={() => setIsCartOpen(false)} className="p-2 text-warmcream/60 hover:text-warmcream">
                                            <i data-lucide="x" className="w-6 h-6"></i>
                                        </button>
                                    </div>

                                    {cart.length === 0 ? (
                                        <div className="py-20 text-center text-warmcream/50 space-y-3">
                                            <i data-lucide="shopping-cart" className="w-12 h-12 mx-auto text-warmcream/20"></i>
                                            <p>Your shopping cart is currently empty.</p>
                                        </div>
                                    ) : (
                                        <div className="py-6 space-y-4">
                                            {cart.map(item => (
                                                <div key={item.id} className="flex items-center justify-between gap-4 p-3 rounded-xl bg-espresso border border-white/5">
                                                    <img src={item.image} alt={item.name} className="w-14 h-14 object-cover rounded-lg shrink-0" />
                                                    <div className="flex-1">
                                                        <h4 className="text-sm font-bold text-warmcream">{item.name}</h4>
                                                        <p className="text-xs text-caramel font-semibold">PKR {item.price}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-darkroast rounded-full px-2 py-1 border border-white/10">
                                                        <button onClick={() => updateQuantity(item.id, -1)} className="text-warmcream/70 hover:text-warmcream px-1">-</button>
                                                        <span className="text-xs font-bold w-4 text-center">{item.quantity}</span>
                                                        <button onClick={() => updateQuantity(item.id, 1)} className="text-warmcream/70 hover:text-warmcream px-1">+</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div className="pt-6 border-t border-white/10 space-y-4">
                                        <div className="space-y-2 text-sm">
                                            <div className="flex justify-between text-warmcream/70">
                                                <span>Subtotal</span>
                                                <span>PKR {subtotal}</span>
                                            </div>
                                            <div className="flex justify-between font-bold text-warmcream text-base pt-2 border-t border-white/5">
                                                <span>Total Amount</span>
                                                <span className="text-caramel">PKR {subtotal}</span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => {
                                                setIsCartOpen(false);
                                                setIsCheckoutOpen(true);
                                            }}
                                            className="w-full py-4 rounded-full bg-caramel text-espresso font-bold text-center text-sm hover:bg-caramel/90 transition-all shadow-lg"
                                        >
                                            Proceed to Checkout
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT MODAL */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-darkroast border border-white/10 rounded-2xl w-full max-w-lg p-6 sm:p-8 space-y-6 my-8">
                                <div className="flex items-center justify-between border-b border-white/10 pb-4">
                                    <h3 className="text-2xl font-serif font-bold text-warmcream">Checkout & Order</h3>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="text-warmcream/60 hover:text-warmcream">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleWhatsAppCheckout} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-warmcream/80 mb-1">Your Full Name *</label>
                                        <input 
                                            type="text"
                                            required
                                            value={customerInfo.name}
                                            onChange={(e) => setCustomerInfo({...customerInfo, name: e.target.value})}
                                            placeholder="e.g. Ali Ahmed"
                                            className="w-full px-4 py-3 rounded-xl bg-espresso border border-white/10 text-warmcream text-sm focus:outline-none focus:border-caramel"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-warmcream/80 mb-1">Mobile / WhatsApp Number *</label>
                                        <input 
                                            type="tel"
                                            required
                                            value={customerInfo.phone}
                                            onChange={(e) => setCustomerInfo({...customerInfo, phone: e.target.value})}
                                            placeholder="0300 1234567"
                                            className="w-full px-4 py-3 rounded-xl bg-espresso border border-white/10 text-warmcream text-sm focus:outline-none focus:border-caramel"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <button
                                            type="button"
                                            onClick={() => setCustomerInfo({...customerInfo, orderType: 'pickup'})}
                                            className={`py-3 rounded-xl border text-xs font-bold transition-all ${
                                                customerInfo.orderType === 'pickup'
                                                ? 'bg-caramel text-espresso border-caramel'
                                                : 'bg-espresso text-warmcream/70 border-white/10'
                                            }`}
                                        >
                                            Pickup at Café
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCustomerInfo({...customerInfo, orderType: 'delivery'})}
                                            className={`py-3 rounded-xl border text-xs font-bold transition-all ${
                                                customerInfo.orderType === 'delivery'
                                                ? 'bg-caramel text-espresso border-caramel'
                                                : 'bg-espresso text-warmcream/70 border-white/10'
                                            }`}
                                        >
                                            Delivery (DHA 6)
                                        </button>
                                    </div>

                                    {customerInfo.orderType === 'delivery' && (
                                        <div>
                                            <label className="block text-xs font-semibold text-warmcream/80 mb-1">Delivery Address *</label>
                                            <textarea 
                                                required
                                                rows="2"
                                                value={customerInfo.address}
                                                onChange={(e) => setCustomerInfo({...customerInfo, address: e.target.value})}
                                                placeholder="Phase 6, Block, House No..."
                                                className="w-full px-4 py-3 rounded-xl bg-espresso border border-white/10 text-warmcream text-sm focus:outline-none focus:border-caramel"
                                            ></textarea>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold text-warmcream/80 mb-1">Special Notes (Optional)</label>
                                        <input 
                                            type="text"
                                            value={customerInfo.notes}
                                            onChange={(e) => setCustomerInfo({...customerInfo, notes: e.target.value})}
                                            placeholder="Extra ice, oat milk, less sugar..."
                                            className="w-full px-4 py-3 rounded-xl bg-espresso border border-white/10 text-warmcream text-sm focus:outline-none focus:border-caramel"
                                        />
                                    </div>

                                    <div className="pt-4 border-t border-white/10 space-y-2 text-xs">
                                        <div className="flex justify-between text-warmcream/70">
                                            <span>Subtotal</span>
                                            <span>PKR {subtotal}</span>
                                        </div>
                                        {customerInfo.orderType === 'delivery' && (
                                            <div className="flex justify-between text-warmcream/70">
                                                <span>Delivery Fee</span>
                                                <span>PKR {CONFIG.deliveryFee}</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between font-bold text-warmcream text-sm pt-2">
                                            <span>Total</span>
                                            <span className="text-caramel">PKR {finalTotal}</span>
                                        </div>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full py-4 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition-all flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <i data-lucide="message-square" className="w-4 h-4"></i>
                                        Send Order via WhatsApp
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* LIGHTBOX MODAL */}
                    {lightboxImg && (
                        <div 
                            onClick={() => setLightboxImg(null)}
                            className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 cursor-pointer"
                        >
                            <img src={lightboxImg} alt="Enlarged gallery preview" className="max-w-full max-h-[90vh] object-contain rounded-lg" />
                        </div>
                    )}

                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide Icons after render
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 500);
    </script>
</body>
</html>
